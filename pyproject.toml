[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.0.0"
description = "Utilities for text"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Caroline Wheeler" },
  { name = "Francesco Polimeni" },
  { name = "Brice Da Costa" },
  { name = "Simon Melkonyan" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["textutils*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/textutils"]
branch = true

[tool.coverage.report]
show_missing = true